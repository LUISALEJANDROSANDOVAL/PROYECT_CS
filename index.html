<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPanel | Proyecto CS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">CS</div>
            <nav>
                <div class="nav-item active">📊 Dashboard</div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h2>Panel de Control <span id="ver-tag">v1.1</span></h2>
                <div class="user-profile">Luis Alejandro</div>
            </header>

            <section class="stats-grid">
                <div class="stat-card">
                    <h4>Archivos en Rama</h4>
                    <p class="stat-value">4</p>
                </div>
                <div class="stat-card">
                    <h4>Estado Git</h4>
                    <p class="stat-value" id="git-status">Conectado</p>
                </div>
            </section>

            <section class="team-section">
                <h3>Equipo del Proyecto</h3>
                <div id="team-grid" class="team-grid">
                    </div>
            </section>

            <button id="btn-sync" class="btn-main">Sincronizar Datos JSON</button>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
