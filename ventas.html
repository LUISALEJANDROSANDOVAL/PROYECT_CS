<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Ventas | Sistema PROYECT_CS</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <h1>Registro de Ventas Mensuales</h1>

  <table border="1">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Precio Unitario</th>
        <th>Subtotal</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Producto 1</td>
        <td>2</td>
        <td>$10.00</td>
        <td>$20.00</td>
      </tr>
      <tr>
        <td>Producto 2</td>
        <td>1</td>
        <td>$20.00</td>
        <td>$20.00</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <th colspan="3">TOTAL GENERAL</th>
        <th>$40.00</th>
      </tr>
    </tfoot>
  </table>

  <p><em>Reporte generado por el módulo de funciones.</em></p>

</body>
</html>
