<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profesores</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Profesores</h1>
    <a href="index.html" class="small">← Volver</a>
    <form onsubmit="event.preventDefault();SchoolApp.saveProfesor(this.profId.value,this.nombre.value,this.asignatura.value);this.reset();SchoolApp.populateSelects();">
      <input type="hidden" id="profId" name="profId" value="">
      <input name="nombre" placeholder="Nombre" required>
      <input name="asignatura" placeholder="Asignatura" required>
      <button class="btn" type="submit">Guardar</button>
    </form>
    <table>
      <thead><tr><th>Nombre</th><th>Asignatura</th><th></th></tr></thead>
      <tbody id="profesoresList"></tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
